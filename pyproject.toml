[project]
name = "asset-publisher"
version = "0.1.0"
description = "Blender で作った3Dアセットを複数の販売先へ出品する"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
asset-publisher = "asset_publisher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asset_publisher*"]
