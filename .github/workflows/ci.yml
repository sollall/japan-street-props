# PR と main への push で、テストと出品のリハーサル（送信なし）を行う。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: 出品のリハーサル（送信しない）
        run: asset-publisher publish assets/*/listing.yaml
